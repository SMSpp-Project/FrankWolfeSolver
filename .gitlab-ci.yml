# The CHANGELOG of the module, held to the format and, on a merge request, to
# the commits of the branch [see ci/changelog.yml of the umbrella].
include:
  - project: smspp/smspp-project
    ref: develop
    file: /ci/changelog.yml

default:
  image: registry.gitlab.com/smspp/smspp-project

cache:
  key: ${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}
  paths:
    - smspp-project

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SMSPP_DEPLOY_KEY")
    - mkdir -p ~/.ssh && ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    # the pull does not recurse into the submodules: CMake initializes
    # the ones the enabled modules need, and a revision the pull walks
    # through may pin a submodule commit no longer on its remote
    - if [ -d smspp-project ]; then (cd smspp-project && git pull --no-recurse-submodules && git submodule update --recursive); else git clone --branch develop git@gitlab.com:smspp/smspp-project.git; fi
    # the cache keeps the submodules an earlier pipeline initialized, and the
    # umbrella turns on by default every module whose submodule is there, and
    # it keeps the build directory, whose CMakeCache.txt remembers the modules
    # turned on then: dropping both leaves exactly the modules this line asks
    # for, which CMake initializes again, the objects being kept all the same
    - git -C smspp-project submodule foreach --quiet 'echo $sm_path' | xargs -r git -C smspp-project submodule deinit --quiet --force --
    - rm -f smspp-project/build/CMakeCache.txt
    # the module is built at the commit of this pipeline, not at the one the
    # umbrella pins, which lags behind until the pin is moved: its submodule is
    # initialized and moved to that commit before CMake, which then leaves it
    - git -C smspp-project submodule update --init --quiet "$CI_PROJECT_TITLE"
    - git -C "smspp-project/$CI_PROJECT_TITLE" fetch --quiet origin "$CI_COMMIT_SHA"
    - git -C "smspp-project/$CI_PROJECT_TITLE" checkout --quiet "$CI_COMMIT_SHA"
    - cmake -S smspp-project -B smspp-project/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_FrankWolfeSolver=ON
    - cmake --build smspp-project/build --target install
  artifacts:
    paths:
      - smspp-project/build
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt
      - .gitlab-ci.yml

test:
  stage: test
  # the academic Gurobi WLS license caps concurrent sessions: a test job may
  # abort at startup with "GRBstartenv returned with status 10030" when other
  # Gurobi-heavy pipelines hold the sessions. Retry to ride out the contention.
  retry:
    max: 2
    when: script_failure
  before_script:
    # write the Gurobi WLS license from the masked CI/CD variables, if set
    - |
      if [ -n "$GRB_WLSSECRET" ]; then
        printf 'LICENSEID=%s\nWLSACCESSID=%s\nWLSSECRET=%s\n' \
          "$GRB_LICENSEID" "$GRB_WLSACCESSID" "$GRB_WLSSECRET" > /tmp/gurobi.lic
        export GRB_LICENSE_FILE=/tmp/gurobi.lic
      fi
  script:
    - ctest -V -C Release -L "$CI_PROJECT_TITLE" --test-dir smspp-project/build --no-tests=error
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt
      - .gitlab-ci.yml

deploy:
  stage: deploy
  script:
    - cd smspp-project/build && cpack -G "TGZ;ZIP;TBZ2"
  artifacts:
    paths:
      - smspp-project/build/*.tar.gz
      - smspp-project/build/*.tar.bz2
      - smspp-project/build/*.zip
  only:
    - tags
